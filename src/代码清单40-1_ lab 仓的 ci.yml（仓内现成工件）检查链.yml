# 本机门禁单的四步照搬上云；要真库的测试分层排除，云端不连库；密钥只写引用名，值面不落纸

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: L1 format
        run: dotnet format src/Lab.AspNetCore.csproj --verify-no-changes --include src/**
      - name: L2+L3 build (warnings as errors)
        run: dotnet build tests/Lab.AspNetCore.Tests.csproj /p:TreatWarningsAsErrors=true
      - name: L4 test
        # RealDb 测试集（*PgTest）硬依赖内网共享 PG，CI runner 不可达 ——
        # 按「CI=翻译性（ToQueryString 无需连库）/ gate=真库（本机全量）」分层排除。
        # suite gate L4 全量跑（scripts/gate.py），真库行为在那里验证。
        run: dotnet test tests/Lab.AspNetCore.Tests.csproj --filter "Category!=RealDb"